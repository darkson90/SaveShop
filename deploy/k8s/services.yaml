# Generato per i 9 microservizi Node: Deployment + Service + HorizontalPodAutoscaler ciascuno.
# DATABASE_URL arriva dal Secret spesa-db (una chiave per servizio), vedi secrets.example.yaml.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels: { app.kubernetes.io/name: auth, app.kubernetes.io/part-of: spesa-smart }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: auth }
  template:
    metadata:
      labels: { app.kubernetes.io/name: auth, app.kubernetes.io/part-of: spesa-smart }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: auth
          image: spesa-smart/auth:latest
          ports: [{ containerPort: 3000, name: http }]
          envFrom: [{ configMapRef: { name: spesa-config } }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: spesa-db, key: auth } }
            - name: SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: spesa-internal, key: service-token } }
            - name: AMQP_URL
              valueFrom: { secretKeyRef: { name: spesa-internal, key: amqp-url } }
            - name: JWT_PRIVATE_KEY_FILE
              value: "/run/keys/jwt-private.pem"
          volumeMounts:
            - { name: jwt, mountPath: /run/keys, readOnly: true }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: jwt
          secret:
            secretName: spesa-jwt
            items:
              - { key: jwt-private.pem, path: jwt-private.pem }
              - { key: jwt-public.pem, path: jwt-public.pem }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector: { app.kubernetes.io/name: auth }
  ports: [{ port: 3000, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: auth }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
