# API Gateway Traefik con la stessa configurazione di sviluppo (gateway/dynamic.yml),
# caricata nel ConfigMap gateway-config da deploy.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: spesa-smart }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: spesa-smart }
    spec:
      containers:
        - name: traefik
          image: traefik:v3.1
          args:
            - --providers.file.filename=/etc/traefik/dynamic.yml
            - --entrypoints.web.address=:8080
            - --ping=true
            - --ping.entrypoint=web
            - --accesslog=true
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /ping, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/traefik, readOnly: true }
      volumes:
        - name: config
          configMap: { name: gateway-config }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app.kubernetes.io/name: gateway }
  ports: [{ port: 80, targetPort: http, name: http }]
---
# TLS 1.3 terminato dall'ingress controller del cluster; sostituire host e issuer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts: [api.example.com]
      secretName: api-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: gateway, port: { name: http } }
          - path: /i
            pathType: Prefix
            backend:
              service: { name: gateway, port: { name: http } }
          - path: /.well-known
            pathType: Prefix
            backend:
              service: { name: gateway, port: { name: http } }
