# Raccolta prezzi nella finestra notturna 02:00–05:00 (ora italiana), come da specifiche.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion
spec:
  schedule: "0 2 * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 10800   # non oltre le 05:00
      template:
        metadata:
          labels: { app.kubernetes.io/name: ingestion, app.kubernetes.io/part-of: spesa-smart }
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingestion
              image: spesa-smart/ingestion:latest
              envFrom: [{ configMapRef: { name: spesa-config } }]
              env:
                - { name: INGESTION_MODE, value: once }
                # In produzione solo fonti reali: i listini "demo" sono fittizi.
                - { name: INGESTION_SOURCES, value: "open_prices,carrefour" }
                - { name: OPEN_PRICES_LAT, value: "46.14" }
                - { name: OPEN_PRICES_LON, value: "12.22" }
                - { name: OPEN_PRICES_RADIUS_KM, value: "40" }
                - name: SERVICE_TOKEN
                  valueFrom: { secretKeyRef: { name: spesa-internal, key: service-token } }
                - name: AMQP_URL
                  valueFrom: { secretKeyRef: { name: spesa-internal, key: amqp-url } }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
