apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spesa-smart

resources:
  - namespace.yaml
  - config.yaml
  - services.yaml
  - gateway.yaml
  - ingestion-cronjob.yaml
  - network-policy.yaml

# Sostituire con il registry e il tag pubblicati dalla CI.
images:
  - { name: spesa-smart/auth, newName: ghcr.io/OWNER/spesa-smart-auth, newTag: latest }
  - { name: spesa-smart/user, newName: ghcr.io/OWNER/spesa-smart-user, newTag: latest }
  - { name: spesa-smart/store, newName: ghcr.io/OWNER/spesa-smart-store, newTag: latest }
  - { name: spesa-smart/catalog, newName: ghcr.io/OWNER/spesa-smart-catalog, newTag: latest }
  - { name: spesa-smart/list, newName: ghcr.io/OWNER/spesa-smart-list, newTag: latest }
  - { name: spesa-smart/pricing, newName: ghcr.io/OWNER/spesa-smart-pricing, newTag: latest }
  - { name: spesa-smart/analytics, newName: ghcr.io/OWNER/spesa-smart-analytics, newTag: latest }
  - { name: spesa-smart/notification, newName: ghcr.io/OWNER/spesa-smart-notification, newTag: latest }
  - { name: spesa-smart/ingestion, newName: ghcr.io/OWNER/spesa-smart-ingestion, newTag: latest }
