apiVersion: v1
kind: ConfigMap
metadata:
  name: spesa-config
data:
  NODE_ENV: production
  PORT: "3000"
  JWT_PUBLIC_KEY_FILE: /run/keys/jwt-public.pem
  AUTH_URL: http://auth:3000
  USER_URL: http://user:3000
  STORE_URL: http://store:3000
  CATALOG_URL: http://catalog:3000
  LIST_URL: http://list:3000
  PRICING_URL: http://pricing:3000
  ANALYTICS_URL: http://analytics:3000
  NOTIFICATION_URL: http://notification:3000
  # Link d'invito e verifica App Links / Universal Links (sostituire con i valori reali).
  PUBLIC_BASE_URL: https://api.example.com
  ANDROID_PACKAGE: it.spesasmart.spesa_smart
  ANDROID_CERT_SHA256: ""
  IOS_APP_ID: TEAMID.it.spesasmart.spesaSmart
