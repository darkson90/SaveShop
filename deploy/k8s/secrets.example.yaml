# ESEMPIO, non applicare così: creare i Secret con valori reali (o da un secret manager / External Secrets).
# PostgreSQL, RabbitMQ e Redis sono previsti come servizi gestiti nella region UE.
apiVersion: v1
kind: Secret
metadata:
  name: spesa-db
  namespace: spesa-smart
stringData:
  auth: postgres://auth:CAMBIAMI@db.example.internal:5432/auth_db
  user: postgres://user:CAMBIAMI@db.example.internal:5432/user_db
  store: postgres://store:CAMBIAMI@db.example.internal:5432/store_db
  catalog: postgres://catalog:CAMBIAMI@db.example.internal:5432/catalog_db
  list: postgres://list:CAMBIAMI@db.example.internal:5432/list_db
  pricing: postgres://pricing:CAMBIAMI@db.example.internal:5432/pricing_db
  analytics: postgres://analytics:CAMBIAMI@db.example.internal:5432/analytics_db
  notification: postgres://notification:CAMBIAMI@db.example.internal:5432/notification_db
---
apiVersion: v1
kind: Secret
metadata:
  name: spesa-internal
  namespace: spesa-smart
stringData:
  service-token: CAMBIAMI-stringa-casuale-lunga
  amqp-url: amqps://spesa:CAMBIAMI@mq.example.internal:5671
  loyalty-key: CAMBIAMI-chiave-cifratura-fidelity
# Gli altri Secret si creano da file:
#   kubectl -n spesa-smart create secret generic spesa-jwt --from-file=jwt-private.pem --from-file=jwt-public.pem
#   kubectl -n spesa-smart create secret generic spesa-fcm --from-file=service-account.json
