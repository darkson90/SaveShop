              value: /run/secrets/fcm/service-account.json
          volumeMounts:
            - { name: jwt, mountPath: /run/keys, readOnly: true }
            - { name: fcm, mountPath: /run/secrets/fcm, readOnly: true }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 5, failureThreshold: 3 }
