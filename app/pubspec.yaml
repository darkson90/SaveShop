name: spesa_smart
description: App Spesa Smart - trova dove la tua lista della spesa costa meno.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0
  geolocator: ^13.0.1
  fl_chart: ^0.69.0
  intl: ^0.19.0
  uuid: ^4.4.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  web_socket_channel: ^3.0.1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
