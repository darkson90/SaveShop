# Ambiente di sviluppo completo: gateway, 9 microservizi Node, ingestion Python,
# PostgreSQL (un database per servizio), RabbitMQ e Redis.
#   ./scripts/gen-keys.sh && docker compose up --build
# API su http://localhost:8080/api/v1, pannello parametri su http://localhost:8080/admin/,
# console RabbitMQ su http://localhost:15672

x-node-service: &node-service
  build:
    context: .
    dockerfile: docker/node.Dockerfile
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  volumes:
    - ./keys/jwt-public.pem:/run/keys/jwt-public.pem:ro
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3000/ready"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 20s

services:
  gateway:
    image: traefik:v3.1
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:8080
      - --accesslog=true
    ports: ["8080:8080"]
    volumes:
      - ./gateway/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on: [auth, user, store, catalog, list, pricing, analytics, notification, config]

  auth:
    <<: *node-service
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { SERVICE: auth } }
    environment:
      DATABASE_URL: postgres://spesa:spesa@postgres:5432/auth_db
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-only-service-token}
      JWT_PRIVATE_KEY_FILE: /run/keys/jwt-private.pem
      # Account che possono entrare nel pannello parametri (separati da virgola).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@saveshop.test}
    volumes:
      - ./keys/jwt-public.pem:/run/keys/jwt-public.pem:ro
      - ./keys/jwt-private.pem:/run/keys/jwt-private.pem:ro

  user:
    <<: *node-service
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { SERVICE: user } }
    environment:
      DATABASE_URL: postgres://spesa:spesa@postgres:5432/user_db
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-only-service-token}
      LOYALTY_KEY: ${LOYALTY_KEY:-dev-only-loyalty-key-change-me}

  store:
    <<: *node-service
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { SERVICE: store } }
    environment:
      DATABASE_URL: postgres://spesa:spesa@postgres:5432/store_db
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-only-service-token}

  catalog:
    <<: *node-service
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { SERVICE: catalog } }
    environment:
      DATABASE_URL: postgres://spesa:spesa@postgres:5432/catalog_db
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-only-service-token}

  list:
    <<: *node-service
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { SERVICE: list } }
    environment:
      DATABASE_URL: postgres://spesa:spesa@postgres:5432/list_db
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-only-service-token}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}   # dominio dei link d'invito

  pricing:
    <<: *node-service
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { SERVICE: pricing } }
    environment:
      DATABASE_URL: postgres://spesa:spesa@postgres:5432/pricing_db
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-only-service-token}
      REDIS_URL: redis://redis:6379/0

  analytics:
    <<: *node-service
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { SERVICE: analytics } }
    environment:
      DATABASE_URL: postgres://spesa:spesa@postgres:5432/analytics_db
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-only-service-token}
      REDIS_URL: redis://redis:6379/1

  notification:
    <<: *node-service
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { SERVICE: notification } }
    environment:
      DATABASE_URL: postgres://spesa:spesa@postgres:5432/notification_db
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-only-service-token}
      # Con un account di servizio Firebase le push partono davvero; senza, finiscono nel log.
      # FCM_SERVICE_ACCOUNT_FILE: /run/secrets/fcm.json

  # Parametri dell'app modificabili a runtime e pannello di amministrazione (/admin/).
  config:
    <<: *node-service
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { SERVICE: config } }
    environment:
      DATABASE_URL: postgres://spesa:spesa@postgres:5432/config_db
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-only-service-token}

  ingestion:
    build: ./services/ingestion
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-only-service-token}
      INGESTION_MODE: loop        # "once" per una singola esecuzione (CronJob in produzione)
      # demo = listini dimostrativi; open_prices = prezzi reali di Open Prices (Open Food Facts, ODbL);
      # carrefour = negozi e prezzi online dal sito carrefour.it (robots.txt rispettato, pagine limitate per notte)
      INGESTION_SOURCES: demo,open_prices,carrefour
      OPEN_PRICES_LAT: "46.14"
      OPEN_PRICES_LON: "12.22"
      OPEN_PRICES_RADIUS_KM: "40"
      INGESTION_INTERVAL_HOURS: "24"
    # Parte quando catalogo, negozi e pricing sono pronti: prima rischiava di pubblicare prezzi
    # che nessuno consumava ancora o di non riuscire a risolvere EAN e punti vendita.
    depends_on:
      rabbitmq: { condition: service_healthy }
      catalog: { condition: service_healthy }
      store: { condition: service_healthy }
      pricing: { condition: service_healthy }

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: spesa
      POSTGRES_PASSWORD: spesa
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spesa"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
