apiVersion: v1
kind: ConfigMap
metadata:
  name: spesa-config
data:
  NODE_ENV: production
  PORT: "3000"
  JWT_PUBLIC_KEY_FILE: /run/keys/jwt-public.pem
  AUTH_URL: http://auth:3000
  USER_URL: http://user:3000
  STORE_URL: http://store:3000
  CATALOG_URL: http://catalog:3000
  LIST_URL: http://list:3000
  PRICING_URL: http://pricing:3000
  ANALYTICS_URL: http://analytics:3000
  NOTIFICATION_URL: http://notification:3000
