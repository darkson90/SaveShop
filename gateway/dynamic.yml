# API Gateway (Traefik): routing per prefisso verso i servizi e rate limit.
# Ogni servizio verifica comunque la firma del JWT; gli endpoint /api/v1/internal/* non sono esposti.
http:
  middlewares:
    # I client non possono spacciarsi per un servizio interno.
    strip-service-headers:
      headers:
        customRequestHeaders:
          X-Service-Token: ""
          X-Acting-User: ""
    # Limite per utente (chiave: header Authorization) sulle API autenticate. Prima era 60 richieste
    # al minuto per IP: l'autocompletamento mentre si scrive la lista lo superava, e con il CGNAT
    # degli operatori mobili tanti utenti condividono lo stesso IP.
    rate-limit:
      rateLimit:
        average: 300
        period: 1m
        burst: 100
        sourceCriterion:
          requestHeaderName: Authorization
    # Login e registrazione: limite stretto per IP contro i tentativi a forza bruta.
    # In Kubernetes deploy.sh aggiunge ipStrategy.depth=1 (IP reale dall'ingress, X-Forwarded-For).
    rate-limit-auth:
      rateLimit:
        average: 20
        period: 1m
        burst: 10
        sourceCriterion:
          ipStrategy: { depth: 0 }
    # Pagine pubbliche dei link d'invito.
    rate-limit-public:
      rateLimit:
        average: 120
        period: 1m
        burst: 30
        sourceCriterion:
          ipStrategy: { depth: 0 }
    block-internal:
      replacePathRegex:
        regex: "^/api/v1/internal/.*"
        replacement: "/not-found"

  routers:
    excluded-stores:
      rule: "PathPrefix(`/api/v1/users/me/excluded-stores`)"
      service: store
      priority: 100
      middlewares: [strip-service-headers, rate-limit]
    stats:
      rule: "PathPrefix(`/api/v1/users/me/stats`)"
      service: analytics
      priority: 100
      middlewares: [strip-service-headers, rate-limit]
    product-prices:
      rule: "PathRegexp(`^/api/v1/products/[^/]+/prices`)"
      service: pricing
      priority: 100
      middlewares: [strip-service-headers, rate-limit]
    auth:
      rule: "PathPrefix(`/api/v1/auth`)"
      service: auth
      middlewares: [strip-service-headers, rate-limit-auth]
    users:
      rule: "PathPrefix(`/api/v1/users`)"
      service: user
      middlewares: [strip-service-headers, rate-limit]
    stores:
      rule: "PathPrefix(`/api/v1/stores`)"
      service: store
      middlewares: [strip-service-headers, rate-limit]
    catalog:
      rule: "PathPrefix(`/api/v1/products`) || PathPrefix(`/api/v1/categories`)"
      service: catalog
      middlewares: [strip-service-headers, rate-limit]
    lists:
      rule: "PathPrefix(`/api/v1/lists`)"
      service: list
      middlewares: [strip-service-headers, rate-limit]
    comparisons:
      rule: "PathPrefix(`/api/v1/comparisons`)"
      service: pricing
      middlewares: [strip-service-headers, rate-limit]
    notifications:
      rule: "PathPrefix(`/api/v1/notifications`)"
      service: notification
      middlewares: [strip-service-headers, rate-limit]
    invite-links:
      rule: "PathPrefix(`/i/`) || PathPrefix(`/.well-known/assetlinks.json`) || PathPrefix(`/.well-known/apple-app-site-association`)"
      service: list
      middlewares: [strip-service-headers, rate-limit-public]
    internal-blocked:
      rule: "PathPrefix(`/api/v1/internal`)"
      service: auth
      priority: 1000
      middlewares: [block-internal]

  services:
    auth:      { loadBalancer: { servers: [{ url: "http://auth:3000" }] } }
    user:      { loadBalancer: { servers: [{ url: "http://user:3000" }] } }
    store:     { loadBalancer: { servers: [{ url: "http://store:3000" }] } }
    catalog:   { loadBalancer: { servers: [{ url: "http://catalog:3000" }] } }
    list:      { loadBalancer: { servers: [{ url: "http://list:3000" }] } }
    pricing:   { loadBalancer: { servers: [{ url: "http://pricing:3000" }] } }
    analytics: { loadBalancer: { servers: [{ url: "http://analytics:3000" }] } }
    notification: { loadBalancer: { servers: [{ url: "http://notification:3000" }] } }
